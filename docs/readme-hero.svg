<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="card-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg-grad)" rx="16"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="180" fill="#0284c7" opacity="0.15" filter="url(#blur-glow)"/>
  <circle cx="1000" cy="360" r="220" fill="#6366f1" opacity="0.15" filter="url(#blur-glow)"/>

  <!-- Subtle Grid Overlay -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200" stroke="#334155" stroke-opacity="0.15" stroke-width="1"/>
  <path d="M150 0 V480 M300 0 V480 M450 0 V480 M600 0 V480 M750 0 V480 M900 0 V480 M1050 0 V480" stroke="#334155" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Header Badge -->
  <g transform="translate(480, 50)">
    <rect width="240" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="120" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">TDK LANDSCAPE // SALES DEMO</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1" text-anchor="middle">Enterprise User Management</text>
  <text x="600" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Zero-boilerplate RBAC, OIDC/OAuth2 PKCE, SCIM 2.0 Provisioning &amp; Immutable Audit Logs</text>

  <!-- PSR Stack Cards -->
  <!-- Admin Stack -->
  <g transform="translate(100, 220)">
    <rect width="300" height="190" rx="12" fill="url(#card-glow)" stroke="#334155" stroke-width="1"/>
    <rect width="300" height="4" rx="2" fill="#38bdf8"/>
    <text x="24" y="36" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">STACK: ADMIN</text>
    <text x="24" y="64" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">User Admin Console</text>
    <text x="24" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Directory &amp; SCIM Provisioning</text>
    
    <rect x="24" y="115" width="118" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="34" y="133" fill="#cbd5e1" font-family="monospace" font-size="11">:4010 user-admin-api</text>

    <rect x="154" y="115" width="122" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="164" y="133" fill="#cbd5e1" font-family="monospace" font-size="11">:3010 user-admin-app</text>
  </g>

  <!-- Portal Stack -->
  <g transform="translate(450, 220)">
    <rect width="300" height="190" rx="12" fill="url(#card-glow)" stroke="#334155" stroke-width="1"/>
    <rect width="300" height="4" rx="2" fill="#818cf8"/>
    <text x="24" y="36" fill="#818cf8" font-family="monospace" font-size="12" font-weight="700">STACK: PORTAL</text>
    <text x="24" y="64" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">User Self-Service</text>
    <text x="24" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">OAuth2 / OIDC PKCE &amp; Sessions</text>

    <rect x="24" y="115" width="118" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="34" y="133" fill="#cbd5e1" font-family="monospace" font-size="11">:4020 user-portal-api</text>

    <rect x="154" y="115" width="122" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="164" y="133" fill="#cbd5e1" font-family="monospace" font-size="11">:3020 user-portal-app</text>
  </g>

  <!-- Compliance Stack -->
  <g transform="translate(800, 220)">
    <rect width="300" height="190" rx="12" fill="url(#card-glow)" stroke="#334155" stroke-width="1"/>
    <rect width="300" height="4" rx="2" fill="#34d399"/>
    <text x="24" y="36" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">STACK: COMPLIANCE</text>
    <text x="24" y="64" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Audit &amp; Governance</text>
    <text x="24" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">SIEM Streams &amp; Ingestion Worker</text>

    <rect x="24" y="115" width="118" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="34" y="133" fill="#cbd5e1" font-family="monospace" font-size="11">:4030 user-audit-api</text>

    <rect x="154" y="115" width="122" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="164" y="133" fill="#cbd5e1" font-family="monospace" font-size="11">:4031 user-audit-worker</text>
  </g>
</svg>
