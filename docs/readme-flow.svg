<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <rect width="1200" height="240" fill="#090d16" rx="12" stroke="#1e293b" stroke-width="1"/>

  <!-- Step 1: service.json -->
  <g transform="translate(60, 50)">
    <rect width="220" height="140" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="10" fill="#38bdf8" opacity="0.2"/>
    <text x="28" y="32" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text>
    <text x="48" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Declare Manifest</text>
    <text x="28" y="65" fill="#94a3b8" font-family="monospace" font-size="11">service.json</text>
    <text x="28" y="85" fill="#64748b" font-family="sans-serif" font-size="12">Port: 4010 / 3010</text>
    <text x="28" y="105" fill="#64748b" font-family="sans-serif" font-size="12">Stack: admin</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 300 120 L 340 120" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: TDK Discovery -->
  <g transform="translate(360, 50)">
    <rect width="220" height="140" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="10" fill="#818cf8" opacity="0.2"/>
    <text x="28" y="32" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">2</text>
    <text x="48" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">TDK Resolution</text>
    <text x="28" y="65" fill="#94a3b8" font-family="monospace" font-size="11">tdk up admin</text>
    <text x="28" y="85" fill="#64748b" font-family="sans-serif" font-size="12">Graph Resolution</text>
    <text x="28" y="105" fill="#64748b" font-family="sans-serif" font-size="12">Port Allocator</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 600 120 L 640 120" stroke="#818cf8" stroke-width="2"/>

  <!-- Step 3: Auto Generation -->
  <g transform="translate(660, 50)">
    <rect width="220" height="140" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="10" fill="#34d399" opacity="0.2"/>
    <text x="28" y="32" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">3</text>
    <text x="48" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Generated Assets</text>
    <text x="28" y="65" fill="#94a3b8" font-family="monospace" font-size="11">.autogenerated/</text>
    <text x="28" y="85" fill="#64748b" font-family="sans-serif" font-size="12">Dockerfiles &amp; Envs</text>
    <text x="28" y="105" fill="#64748b" font-family="sans-serif" font-size="12">TypeScript Plumbing</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 900 120 L 940 120" stroke="#34d399" stroke-width="2"/>

  <!-- Step 4: Live Environment -->
  <g transform="translate(960, 50)">
    <rect width="180" height="140" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="10" fill="#f43f5e" opacity="0.2"/>
    <text x="28" y="32" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">4</text>
    <text x="48" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Live Landscape</text>
    <text x="28" y="65" fill="#94a3b8" font-family="monospace" font-size="11">Tilt Engine</text>
    <text x="28" y="85" fill="#64748b" font-family="sans-serif" font-size="12">Live Hot Reload</text>
    <text x="28" y="105" fill="#64748b" font-family="sans-serif" font-size="12">Health Checks</text>
  </g>
</svg>
